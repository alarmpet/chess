<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잡기 맞히기 시험</title>
<style>
  /* 사람 시험 A (docs/plans/2026-11-08-capture-matchup-plan.md 7절): 소리·글자 없이 잡기 영상만 보고
     「누가 잡았나 · 누가 잡혔나」를 맞힌다. 영상은 글자를 끄고 찍은 video/*-quiz.mp4 30개. */
  :root { --bg: #f7f5ef; --fg: #222; --muted: #6b6b6b; --card: #fff; --line: #ddd8cc; --pick: #2f7d4f; --pickfg: #fff; --bad: #b5402a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1c1e; --fg: #eee; --muted: #a0a0a0; --card: #26282b; --line: #3a3d42; --pick: #49a36e; --pickfg: #111; --bad: #e0745c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
  video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .q { margin-top: 10px; font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button.on { background: var(--pick); color: var(--pickfg); border-color: var(--pick); }
  button.main { background: var(--pick); color: var(--pickfg); border-color: var(--pick); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  .x { color: var(--bad); font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font: 12px/1.4 ui-monospace, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>잡기 맞히기 시험</h1>
  <div id="intro" class="card">
    <p>체스 말(동물)이 다른 말을 잡는 짧은 영상 30개가 섞여서 나옵니다. 소리와 글자는 없습니다.</p>
    <p>영상마다 <b>잡은 동물</b>과 <b>잡힌 동물</b>을 고르세요. 헷갈리면 「모르겠음」을 고르면 됩니다. 영상은 반복 재생됩니다.</p>
    <p class="muted">미어캣=폰 · 캥거루=나이트 · 판다=비숍 · 코뿔소=룩 · 호랑이=퀸 · 사자=킹. 진행 상황은 이 브라우저에 저장돼 중간에 닫아도 이어집니다.</p>
    <div class="bar"><span class="muted" id="resumeNote"></span><button class="main" id="start">시작</button></div>
  </div>
  <div id="quiz" class="card" hidden>
    <div class="bar"><b id="count"></b><span class="muted">재생 <span id="plays">0</span>회</span></div>
    <video id="vid" muted loop autoplay playsinline></video>
    <div class="q">잡은 동물</div><div class="opts" id="atk"></div>
    <div class="q">잡힌 동물</div><div class="opts" id="vic"></div>
    <div class="bar"><button id="back">이전</button><button class="main" id="next" disabled>다음</button></div>
  </div>
  <div id="done" class="card" hidden>
    <h2 style="margin-top:0">결과</h2>
    <p id="score"></p>
    <div id="tables"></div>
    <p class="q">결과 기록(아래 글을 복사해 보내 주세요)</p>
    <textarea id="json" readonly></textarea>
    <div class="bar"><button id="copy">복사</button><button id="reset">처음부터 다시</button></div>
  </div>
</main>
<script>
const KEY = 'wildcrown.quizA.v1';
const ANIMALS = { pawn: '미어캣', knight: '캥거루', bishop: '판다', rook: '코뿔소', queen: '호랑이', king: '사자' };
const ATTACKERS = ['pawn', 'knight', 'bishop', 'rook', 'queen', 'king'];
const VICTIMS = ['pawn', 'knight', 'bishop', 'rook', 'queen'];
const CELLS = ATTACKERS.flatMap((a) => VICTIMS.map((v) => `${a}>${v}`));

function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function shuffled(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fresh() { return { v: 1, started: new Date().toISOString(), order: shuffled(CELLS), i: 0, answers: {} }; }

let state = load();
if (!state || state.v !== 1 || !Array.isArray(state.order) || state.order.length !== CELLS.length) state = null;
const $ = (id) => document.getElementById(id);
if (state && Object.keys(state.answers).length) $('resumeNote').textContent = `${Object.keys(state.answers).length}/30 답한 기록이 있습니다. 이어서 합니다.`;

let shownAt = 0;
let plays = 0;
// 본 횟수 = 처음 1번 + 끝에서 처음으로 되감긴 횟수(반복 재생에서는 playing 이 다시 오기도 해 세지 않는다).
let lastT = 0;
$('vid').addEventListener('loadeddata', () => { plays = 1; lastT = 0; $('plays').textContent = plays; });
$('vid').addEventListener('timeupdate', (e) => { const t = e.target.currentTime; if (t < lastT - 0.5) { plays += 1; $('plays').textContent = plays; } lastT = t; });

function options(box, list, field) {
  box.innerHTML = '';
  for (const id of [...list, 'unknown']) {
    const b = document.createElement('button');
    b.textContent = id === 'unknown' ? '모르겠음' : ANIMALS[id];
    b.dataset.id = id;
    b.onclick = () => {
      const key = state.order[state.i];
      const ans = state.answers[key] || {};
      ans[field] = id;
      ans.ms = Math.round(performance.now() - shownAt);
      ans.plays = plays;
      state.answers[key] = ans;
      save();
      paint();
    };
    box.appendChild(b);
  }
}

function paint() {
  const key = state.order[state.i];
  const ans = state.answers[key] || {};
  for (const b of $('atk').children) b.classList.toggle('on', b.dataset.id === ans.atk);
  for (const b of $('vic').children) b.classList.toggle('on', b.dataset.id === ans.vic);
  $('next').disabled = !(ans.atk && ans.vic);
  $('next').textContent = state.i === CELLS.length - 1 ? '결과 보기' : '다음';
  $('back').disabled = state.i === 0;
}

function show() {
  const key = state.order[state.i];
  $('count').textContent = `${state.i + 1} / ${CELLS.length}`;
  plays = 0;
  $('plays').textContent = 0;
  $('vid').src = `video/${key.replace('>', '-x-')}-quiz.mp4`;
  shownAt = performance.now();
  paint();
}

function finish() {
  $('quiz').hidden = true;
  $('done').hidden = false;
  $('vid').removeAttribute('src');
  let atkOk = 0, vicOk = 0, both = 0;
  const atkTab = {}, vicTab = {};
  for (const key of CELLS) {
    const [a, v] = key.split('>');
    const ans = state.answers[key] || {};
    if (ans.atk === a) atkOk++;
    if (ans.vic === v) vicOk++;
    if (ans.atk === a && ans.vic === v) both++;
    atkTab[a] ||= {}; atkTab[a][ans.atk || 'none'] = (atkTab[a][ans.atk || 'none'] || 0) + 1;
    vicTab[v] ||= {}; vicTab[v][ans.vic || 'none'] = (vicTab[v][ans.vic || 'none'] || 0) + 1;
  }
  $('score').innerHTML = `잡은 동물 <b>${atkOk}/30</b> · 잡힌 동물 <b>${vicOk}/30</b> · 둘 다 <b>${both}/30</b>`;
  const table = (title, rows, cols, tab) => {
    let h = `<p class="q">${title} (줄 = 실제, 칸 = 고른 것)</p><table><tr><th></th>${[...cols, 'unknown'].map((c) => `<th>${c === 'unknown' ? '모름' : ANIMALS[c]}</th>`).join('')}</tr>`;
    for (const r of rows) h += `<tr><th>${ANIMALS[r]}</th>${[...cols, 'unknown'].map((c) => { const n = tab[r]?.[c] || 0; return `<td class="${n && c !== r ? 'x' : ''}">${n || ''}</td>`; }).join('')}</tr>`;
    return h + '</table>';
  };
  $('tables').innerHTML = table('잡은 동물', ATTACKERS, ATTACKERS, atkTab) + table('잡힌 동물', VICTIMS, VICTIMS, vicTab);
  $('json').value = JSON.stringify({ test: 'capture-matchup A', v: 1, started: state.started, finished: new Date().toISOString(), atkOk, vicOk, both, answers: state.answers });
}

$('start').onclick = () => {
  if (!state) { state = fresh(); save(); }
  $('intro').hidden = true;
  if (Object.keys(state.answers).length === CELLS.length && state.i === CELLS.length - 1 && state.finished) return finish();
  $('quiz').hidden = false;
  options($('atk'), ATTACKERS, 'atk');
  options($('vic'), VICTIMS, 'vic');
  show();
};
$('next').onclick = () => {
  if (state.i === CELLS.length - 1) { state.finished = true; save(); return finish(); }
  state.i++; save(); show();
};
$('back').onclick = () => { if (state.i > 0) { state.i--; save(); show(); } };
$('copy').onclick = async () => { $('json').select(); try { await navigator.clipboard.writeText($('json').value); $('copy').textContent = '복사됨'; } catch (e) { document.execCommand('copy'); } };
$('reset').onclick = () => { state = fresh(); save(); $('done').hidden = true; $('intro').hidden = false; $('resumeNote').textContent = ''; };
</script>
</body>
</html>
