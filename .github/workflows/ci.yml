# Tests + gates + production build (PLAN §7 · 관리 계획서 §4.3 S1).
# 순서: 타입 검사 → 빠른 테스트 → 느린 시뮬 테스트 → 에셋 게이트 → 빌드 → 번들 게이트 → 드로우콜 게이트(체스 100 · 섬 180).
#
# 언제 도나(2026-11-05 정리):
#  - PR 이 열린 브랜치는 pull_request 로 한 번만 돈다. 예전에는 push 와 pull_request 가 같은 커밋에 두 번 돌았다.
#  - push 로는 main 에서만 돈다(병합 뒤 확인).
#  - 문서·기록만 바뀐 커밋(docs/**, *.md, 캡처)은 돌지 않는다.
#  - 같은 브랜치에 새 푸시가 오면 앞서 돌던 실행은 취소된다 — 여러 번 푸시해도 마지막 것만 끝까지 돈다.
#  - 손으로 돌리려면 Actions 탭에서 「Run workflow」(workflow_dispatch).
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '**/*.jpg', '**/*.png']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '**/*.jpg', '**/*.png']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:slow
      - run: npm run gate:assets
      - run: npm run build
      - run: npm run gate:bundle
      - run: npm run gate:drawcalls
      - run: npm run gate:drawcalls:village
